name: Formula

# The formula is written on Windows, where there is no Homebrew and no Ruby, so
# nothing about it can be checked locally. This is where it is actually verified:
# installed, audited, and run on real runners.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        # macOS arm64 and Linux x86_64 are the two platforms with runners. Intel
        # Macs have no hosted runner any more, so that combination is published
        # unverified — stated in the README rather than left to be assumed.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ubuntu runners have no Homebrew at all — the first run failed with
      # "brew: command not found". The official action installs it on both.
      - uses: Homebrew/actions/setup-homebrew@master

      - name: Style
        run: brew style Formula/samong.rb

      - name: Audit (advisory)
        continue-on-error: true
        run: brew audit --formula --strict Formula/samong.rb

      # Homebrew refuses a formula given as a path — "Homebrew requires formulae
      # to be in a tap" — so the checkout is copied into a throwaway local tap.
      # That also means a pull request tests the formula in the branch rather than
      # whatever is already published.
      - name: Install it, from a tap made out of this checkout
        run: |
          brew tap-new ci/samong --no-git
          cp Formula/samong.rb "$(brew --repo ci/samong)/Formula/samong.rb"
          brew install --formula --verbose ci/samong/samong

      - name: The formula's own test block
        run: brew test ci/samong/samong

      # The reason this tap exists. Homebrew fetches with curl, which does not set
      # com.apple.quarantine, so Gatekeeper has nothing to refuse — unlike the same
      # archive downloaded in a browser, which it blocks outright.
      - name: No quarantine flag on macOS
        if: runner.os == 'macOS'
        run: |
          binary="$(command -v samong)"
          echo "installed at $binary"
          if xattr -p com.apple.quarantine "$binary" 2>/dev/null; then
            echo "::error::the installed binary carries com.apple.quarantine"
            exit 1
          fi
          echo "no com.apple.quarantine — Gatekeeper will not intervene"
          samong --version

      - name: All four binaries are on PATH and answer
        run: |
          for b in samong samong-server samong-mcp samong-app; do
            command -v "$b" >/dev/null || { echo "::error::$b missing"; exit 1; }
            echo "  $b -> $(command -v "$b")"
          done
          samong --version
          samong-server --version
