name: Bump

# Polls rather than being pushed to.
#
# The alternative is a repository_dispatch from waanvar/samong's release workflow,
# which is instant — but cross-repo dispatch needs a long-lived personal access
# token stored as a secret in both places. A formula lagging a release by a few
# hours costs nothing; a leaked PAT with repo scope costs a great deal. Use
# workflow_dispatch when it needs to be immediate.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Specific version to pin, e.g. 0.4.0. Blank means the latest release."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    # macOS, because the formula has to be installed and tested before the commit
    # and only a Mac exercises the arm64 archive most users will take.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Before the rewrite, not after, and unconditionally.
      #
      # This repository is named `homebrew-*`, so setup-homebrew treats it as a tap
      # and re-runs its checkout logic in the workspace — the log says
      # "Deleting the contents of .../homebrew-samong" followed by `git init`. Run
      # after the rewrite, it threw the rewrite away: the formula went back to the
      # previous version, the step below then installed and tested *that* while
      # claiming to have tested the rewritten one, and Commit found a clean tree
      # and failed with "nothing to commit". A green step that verified the
      # opposite of its own name.
      #
      # The cost of running it always is about half a minute on days when nothing
      # changed. The cost of the old order was a tap that could never bump itself.
      - uses: Homebrew/actions/setup-homebrew@master

      - name: Rewrite the formula if upstream moved
        id: bump
        # bump.py asks the API which release is latest. Unauthenticated that is 60
        # requests an hour *per runner IP*, shared with every other job on the
        # pool — which is why this step failed five scheduled runs in a row with
        # `403: rate limit exceeded` while the formula sat on an old version. The
        # token is the automatic one; it needs no secret and grants 5,000/hour.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            python3 bump.py --version "${{ inputs.version }}"
          else
            python3 bump.py
          fi
          if git diff --quiet -- Formula/samong.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "already current"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$(sed -n 's/^  version "\(.*\)"/\1/p' Formula/samong.rb)" >> "$GITHUB_OUTPUT"
          fi

      # Verified before it is committed, not after. A tap whose default branch
      # holds a formula that does not install is worse than one that lags.
      - name: The rewritten formula must install and pass its own test
        if: steps.bump.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          # Assert the subject before testing it. This step once passed having
          # installed the *previous* version, because something between the
          # rewrite and here had restored the file — and nothing in the step
          # noticed, so its name was simply untrue. Checking that the formula on
          # disk is the version the bump produced is what makes the rest of this
          # step mean what it says.
          on_disk=$(sed -n 's/^  version "\(.*\)"/\1/p' Formula/samong.rb)
          if [ "$on_disk" != "$VERSION" ]; then
            echo "::error::about to test $on_disk but the bump produced $VERSION — the rewrite did not survive to this step"
            exit 1
          fi
          echo "testing the formula at $on_disk"

          brew style Formula/samong.rb
          brew tap-new ci/samong --no-git
          cp Formula/samong.rb "$(brew --repo ci/samong)/Formula/samong.rb"
          brew install --formula --verbose ci/samong/samong
          brew test ci/samong/samong

          # And the binary that got installed has to be that version too, which is
          # the only claim that survives a formula pointing at the wrong archive.
          got=$(samong --version | tr -d '\r' | awk '{print $NF}')
          if [ "$got" != "$VERSION" ]; then
            echo "::error::installed samong reports $got, expected $VERSION"
            exit 1
          fi
          echo "installed samong reports $got"

      - name: Commit
        if: steps.bump.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          # Needed because the push below names its remote explicitly rather than
          # relying on what actions/checkout left behind — see the comment there.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/samong.rb
          printf '%s\n\n%s\n' \
            "chore: samong $VERSION" \
            "Version and all three checksums taken from the .sha256 files published beside the release archives. Installed and tested on this runner before the commit — a tap whose main branch does not install is worse than one that lags a few hours." \
            > /tmp/msg
          git commit -F /tmp/msg

          # Both the remote and the refspec are explicit, because setup-homebrew
          # re-creates this checkout with `git init` — which leaves `main` with no
          # upstream (a bare `git push` fails with "has no upstream branch") and
          # discards the credential actions/checkout had configured. Naming the
          # URL and the refspec depends on neither. The token is masked in logs.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:main
